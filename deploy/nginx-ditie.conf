# 地铁冲冲冲！—— Nginx 站点配置（子域名 ditie.gmgnclaw.com）
# 放到 /etc/nginx/conf.d/ditie.conf，然后 nginx -t && systemctl reload nginx
# 网站文件放在 /var/www/ditie（就是 yarn build 生成的 out/ 目录里的内容）

server {
    listen 80;
    server_name ditie.gmgnclaw.com;

    root /var/www/ditie;
    index index.html;

    # 带哈希的静态资源（JS、CSS、字体）可以长期缓存
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 网页本身不缓存，更新后马上生效
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }

    # 全网排行榜：转发给本机的排行榜服务（server/leaderboard.js）
    location /api/ {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 8k;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

